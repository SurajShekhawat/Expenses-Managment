<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean solid emerald background squircle -->
  <rect width="512" height="512" rx="128" fill="#059669"/>
  
  <!-- Subtle accent circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12"/>

  <!-- Upward Trend Chart Line -->
  <path d="M128 340 L210 260 L290 300 L384 170" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow head -->
  <polygon points="384,140 330,170 384,224" fill="#ffffff" />
  
  <!-- ₹ Rupee Symbol -->
  <text x="230" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="160" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>

  <!-- Sparkle dot -->
  <circle cx="384" cy="170" r="14" fill="#ffffff"/>
</svg>